services:
  resume-service-ai:
    image: arindampal28/interviewmate-resume-service-ai:0.0.1
    container_name: backend-resume-service-ai

    env_file:
      - .env

    networks:
      - interviewmate-network

    ports:
      - "8005:8005"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/resumeanalyzer/api/v1/healthcheck"]
      interval: 10s
      retries: 10
      start_period: 40s

networks:
  interviewmate-network:
    external: true