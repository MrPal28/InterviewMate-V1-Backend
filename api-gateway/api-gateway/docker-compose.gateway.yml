
services:
  api-gateway:
    image: arindampal28/interviewmate-api-gateway:0.0.2
    container_name: backend-api-gateway
    
    restart: unless-stopped   
    env_file:
      - .env

    networks:
      - interviewmate-network

    volumes:
      - gateway-logs:${LOG_PATH:-/app/logs}

    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  interviewmate-network:
    external: true

volumes:
  gateway-logs:
