
upstream api-gateway {
    server backend-api-gateway:8080;
}

upstream eureka-server{
    server backend-eureka-server:8761;
}

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://api-gateway;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route to Eureka Dashboard (served at / on the backend)
    location = /eureka/ {
        proxy_pass http://eureka-server/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route to Eureka Assets and API (served at /eureka/ on the backend)
    location /eureka/ {
        proxy_pass http://eureka-server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}