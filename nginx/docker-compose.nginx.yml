services:
  nginx:
    image: nginx:latest
    container_name: interviewmate-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      api-gateway:
        condition: service_started

    networks:
      - interviewmate-network

networks:
  interviewmate-network:
    external: true